version: "3.8"

x-common-resources: &common-resources
  deploy:
    resources:
      limits:
        memory: 700m

x-common-network: &common-network
  networks:
    - buckaroo

x-common-healthcheck-configserver: &healthcheck-configserver
  healthcheck:
    test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

x-common-healthcheck-rabbit: &healthcheck-rabbit
  healthcheck:
    test: rabbitmq-diagnostics check_port_connectivity
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 5s

services:
  rabbit:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    <<: *healthcheck-rabbit

  configserver:
    image: "jasonkhongwir/configserver:s4"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    <<: *healthcheck-configserver
    <<: *common-resources
    <<: *common-network

  accounts:
    image: "jasonkhongwir/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    <<: *common-resources
    <<: *common-network
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default

  loans:
    image: "jasonkhongwir/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    <<: *common-resources
    <<: *common-network
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default

  cards:
    image: "jasonkhongwir/cards:s4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    <<: *common-resources
    <<: *common-network
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default

networks:
  buckaroo:
    driver: bridge

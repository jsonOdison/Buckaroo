spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      bus:
        enabled: true
        refresh:
          enabled: true
      server:
        git:
          uri: "https://github.com/jsonOdison/buckaroo_config_server.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true

encrypt:

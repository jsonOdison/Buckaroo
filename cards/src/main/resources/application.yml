server:
  port: 9000
spring:
  application:
    name: "cards"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071"
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
  management:
    include: "*"
build:
  version: "1.0"

cards:
  message: "Welcome to Buckaroo cards related local APIs "
  contactDetails:
    name: "Jason khongwir"
    email: "-.com"
  onCallSupport:
    - (412) 419-3491
    - (915) 382-1932
